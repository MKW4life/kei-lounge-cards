name: Verify Kei Projects navigation

on:
  pull_request:
    paths:
      - "app/**"
      - "components/**"
      - "package*.json"
      - "tsconfig.json"
      - ".github/workflows/check-kei-projects-navigation.yml"

permissions:
  contents: read

jobs:
  nextjs-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Verify types
        run: npx tsc --noEmit
      - name: Build Next.js app
        run: npm run build
